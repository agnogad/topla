<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topla — Medya indirici</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m-5-5 5 5 5-5M4 20h16"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m4 17 5-5 4 4 3-3 4 4"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="m17 10 4-3v10l-4-3z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 3h.01"/></symbol>
</svg>

<div id="app" class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg class="ico"><use href="#i-download"/></svg></span>
      <span class="brand-name">Topla</span>
    </div>
    <span id="toolStatus" class="status-line mono">yt-dlp kontrol ediliyor</span>
    <span class="grow"></span>
    <button id="folderBtn" class="btn ghost"><svg class="ico"><use href="#i-folder"/></svg> Klasörü aç</button>
    <button id="themeBtn" class="icon-btn" title="Temayı değiştir" aria-label="Temayı değiştir"><svg class="ico"><use href="#i-sun"/></svg></button>
  </header>

  <div class="workspace">
    <main class="main" id="main">
      <section class="card composer">
        <div class="card-head">
          <h1>Bağlantıdan indir</h1>
          <p>Video, ses veya görsel bağlantısını yapıştır; biçimi seç ve indir.</p>
        </div>
        <div class="url-row">
          <svg class="ico url-ico"><use href="#i-link"/></svg>
          <input id="urlInput" type="url" spellcheck="false" autocomplete="off" placeholder="Bağlantıyı yapıştır" aria-label="Medya bağlantısı">
          <button id="analyseBtn" class="btn">Çözümle</button>
        </div>
        <p class="hint">YouTube · YouTube Music · X · Instagram · Facebook · TikTok</p>
      </section>

      <section id="resultCard" class="card result" hidden>
        <div class="filmstrip" aria-hidden="true"></div>
        <div class="result-body">
          <div id="mediaThumb" class="media-thumb"><svg class="ico"><use href="#i-video"/></svg></div>
          <div class="result-meta">
            <span id="sourceBadge" class="badge">Bağlantı</span>
            <h2 id="mediaTitle">—</h2>
            <p id="mediaSub" class="mono">—</p>
          </div>
        </div>
        <h3 class="section-label">Biçim</h3>
        <div id="formats" class="formats"></div>
        <div class="actions">
          <button id="downloadBtn" class="btn primary"><svg class="ico"><use href="#i-download"/></svg> İndir</button>
          <button id="cancelBtn" class="btn ghost" hidden>İptal</button>
        </div>
      </section>

      <section id="progressCard" class="card progress" hidden>
        <div class="progress-head">
          <span id="progressLabel">İndiriliyor</span>
          <span id="progressPct" class="mono">0%</span>
        </div>
        <div class="track"><div id="progressFill" class="fill"></div></div>
        <p id="progressLine" class="mono progress-line">—</p>
      </section>
    </main>

    <aside class="panel">
      <div class="panel-section">
        <h3>Çıktı klasörü</h3>
        <div class="folder-row">
          <input id="outdirInput" class="mono" type="text" spellcheck="false" aria-label="Çıktı klasörü">
          <button id="pickBtn" class="btn ghost">Değiştir</button>
        </div>
      </div>
      <div class="panel-section grow">
        <h3>Son indirmeler</h3>
        <ul id="history" class="history"></ul>
      </div>
      <div class="panel-foot mono">yt-dlp <span id="toolVersion">—</span></div>
    </aside>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
